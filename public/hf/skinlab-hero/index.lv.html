        padding: 26px 26px 10px;
        background: var(--paper);
        box-shadow: var(--shadow-print);
        border-radius: 2px;
        opacity: 0;

        left: 50%;
        top: -14px;
        width: 96px;
        height: 28px;
        margin-left: -48px;

      .card .nm {
        width: max-content;
        font-family: 'Noto Serif Display', serif;
        font-weight: 400;
        font-stretch: 80%;

        color: var(--ink);

      }
      .card .hand {
        display: block;

      }
      .marker7 {
        width: auto;
        padding: 0 20px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .hand-t {
        font-family: 'Bad Script', serif;
        font-size: 64px;
        fill: var(--rouge);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        height: 104px;
        padding: 0 50px;
        background: var(--ink);
        border-radius: 999px;
        box-shadow: var(--shadow-print);
        white-space: nowrap;
        opacity: 0;
      }

        font-weight: 600;
        font-size: 48px;
        line-height: 1;

      }
      .pring {
        position: absolute;
        left: 0;
        top: 0;
        border-radius: 999px;
        border: 3px solid var(--rouge);
        opacity: 0;
      }
      .touch {
        position: absolute;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: var(--glaze);
        border: 2px solid var(--rouge);
        box-shadow: 0 14px 30px rgb(58 34 40 / 0.38);
        opacity: 0;
      }

      /* ── Hook (S0 / S10) ── */
      #hooksvg {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1350px;
      }
      .hk-word,
      .hk-comma {
        font-family: 'Noto Serif Display', serif;
        font-weight: 900;
        font-stretch: 62.5%;
      }
      .hk-comma {
        fill: var(--rouge);
      }
      .hk-kicker {
        position: absolute;
        left: 120px;
        top: 296px;
        height: 44px;
        font-family: 'Martian Mono', monospace;
        font-weight: 500;
        font-stretch: 75%;
        font-size: 44px;
        line-height: 44px;
        letter-spacing: 0.12em;
        color: var(--rouge);
        white-space: nowrap;
      }
      .hk-line {
        position: absolute;
        left: 120px;
        top: 940px;
        font-family: 'Noto Serif Display', serif;
        font-style: italic;
        font-weight: 300;
        font-stretch: 80%;
        line-height: 1.1;
        color: var(--ink);
        white-space: nowrap;
      }
      .hk-chip-pos {
        position: absolute;
        left: 120px;
        top: 1120px;
        height: 76px;
        transform: rotate(-2deg);
        transform-origin: 0 50%;
      }
      .hk-chip {
        display: flex;
        align-items: center;
        height: 100%;
        padding: 0 28px;
        background: var(--rouge);
        color: var(--glaze);
        border-radius: 999px;
        font-family: 'Martian Mono', monospace;
        font-weight: 600;
        font-stretch: 75%;
        font-size: 44px;
        line-height: 44px;
        white-space: nowrap;

      #grain {
        background: url(assets/grain-256.png) repeat;
        opacity: 0.04;
        mix-blend-mode: multiply;
        pointer-events: none;
      }
      .dbg {
        position: absolute;
        outline: 3px solid #ff0000;
        background: rgb(255 0 0 / 0.12);
      }
